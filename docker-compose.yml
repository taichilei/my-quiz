version: '3.8'

services:
  # MongoDB 数据库
  mongo:
    image: mongo:7
    container_name: my-quiz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - my-quiz-net

  # 后端 API
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: my-quiz-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - my-quiz-net

  # 前端 Web
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: my-quiz-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - my-quiz-net

volumes:
  mongo_data:

networks:
  my-quiz-net:
    driver: bridge
