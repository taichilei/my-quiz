services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: my-quiz-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=my-quiz
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-quiz-net

  # 后端 API
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: my-quiz-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - POSTGRES_URI=postgres://postgres:postgres@postgres:5432/my-quiz?sslmode=disable
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - my-quiz-net

  # 前端 Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: my-quiz-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - my-quiz-net

volumes:
  postgres_data:

networks:
  my-quiz-net:
    driver: bridge
