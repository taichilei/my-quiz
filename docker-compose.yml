services:
  # PostgreSQL 数据库（dev/full 都需要）
  postgres:
    image: postgres:16-alpine
    container_name: my-quiz-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=my-quiz
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-quiz-net

  # 本地邮件桩（dev/full 都需要）
  # mailpit 是 mailhog 的现代替代：drop-in 兼容 SMTP，UI 更现代
  mailhog:
    image: axllent/mailpit:latest
    container_name: my-quiz-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    environment:
      # 接受任意 SMTP 凭据（dev 环境邮件桩，安全无所谓）
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      # 允许在非 TLS 连接上做 PLAIN auth（Go net/smtp 默认行为）
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - my-quiz-net

  # 后端 API（仅在 --profile full 时启动）
  server:
    profiles: ["full"]
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: my-quiz-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - POSTGRES_URI=postgres://postgres:postgres@postgres:5432/my-quiz?sslmode=disable
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USERNAME=dev@my-quiz.local
      - SMTP_PASSWORD=dev
      - SMTP_FROM_NAME=MyQuiz
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - mailhog
    networks:
      - my-quiz-net

  # 前端 Web（仅在 --profile full 时启动）
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: my-quiz-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - my-quiz-net

volumes:
  postgres_data:

networks:
  my-quiz-net:
    driver: bridge
