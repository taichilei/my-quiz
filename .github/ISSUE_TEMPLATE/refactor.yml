name: 🔨 Refactor / Tech Debt
description: 架构优化、重构、技术债
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 现状问题
      description: 当前代码/架构有什么问题，为什么要改
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 改进方案
      description: 打算怎么改
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完成标志
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: Web (apps/web)
        - label: iOS / Android (apps/native)
        - label: 后端 (server)
        - label: 数据库 schema / 迁移
        - label: 破坏向后兼容
  - type: textarea
    id: rollback
    attributes:
      label: 风险与回退（可选）
      description: 改坏了怎么办，怎么回滚
  - type: textarea
    id: refs
    attributes:
      label: 关联（可选）